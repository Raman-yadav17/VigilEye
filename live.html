<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VigilEye – Live</title>
<style>
:root{--bg:#eceff1;--surface:#fff;--ink:#15233a;--muted:#52617a;--line:#d3dae2;--amber:#f0a500;--ok:#1c8a4f;--warn:#b97800;--danger:#cc3434}
@media (prefers-color-scheme:dark){:root{--bg:#0f1826;--surface:#16233a;--ink:#e6edf6;--muted:#9aaac1;--line:#27395a;--ok:#46d283;--warn:#f2b441;--danger:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif;border:6px solid transparent;min-height:100vh;transition:border-color .2s}
body.l1{border-color:var(--warn)}body.l2{border-color:var(--danger)}
.wrap{max-width:1100px;margin:0 auto;padding:16px 20px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.pill{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.video{aspect-ratio:4/3;background:#0b1118;border-radius:8px;overflow:hidden;display:grid;place-items:center;color:#9aaac1;text-align:center;position:relative}
.video img{width:100%;height:100%;object-fit:contain;display:none}
.video.on img{display:block}.video.on p{display:none}
.calib{position:absolute;left:0;right:0;bottom:0;background:rgba(240,165,0,.92);color:#1d1500;padding:8px;font-weight:600;display:none}
.state{font-size:30px;font-weight:800;line-height:1.1;margin:0}
.reason{color:var(--muted);margin:2px 0 12px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s,background .3s}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tile b{display:block;font-size:20px}.tile span{font-size:13px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:600 14px system-ui;padding:9px 14px;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.primary{background:var(--amber);border-color:var(--amber);color:#1d1500}
button.on{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h2{font-size:16px;margin:18px 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
.err{color:var(--danger);font-weight:600;margin:8px 0 0}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>VigilEye</h1><span class="pill" id="conn">Connecting…</span></header>
  <div class="grid">
    <div class="card">
      <div class="video" id="video"><p>Camera is off.<br>Press Start to begin.</p><img id="feed" alt="Live camera feed with eye outlines"><div class="calib" id="calib"></div></div>
      <div class="btns">
        <button class="primary" id="start">Start</button><button id="stop">Stop</button>
        <button id="recalibrate">Recalibrate</button><button id="lowlight">Low-light mode</button><button id="voice">Voice</button>
      </div>
      <p class="err" id="err"></p>
    </div>
    <div class="card">
      <p class="state" id="label">Stopped</p><p class="reason" id="reason">&nbsp;</p>
      <div class="bar"><i id="bar"></i></div><div class="pill" id="score" style="margin-top:6px">Fatigue 0/100</div>
      <div class="tiles">
        <div class="tile"><b id="ear">–</b><span>Eye ratio</span></div><div class="tile"><b id="mar">–</b><span>Mouth ratio</span></div><div class="tile"><b id="fps">–</b><span>Frames/sec</span></div>
        <div class="tile"><b id="closure">–</b><span>Eyes closed (s)</span></div><div class="tile"><b id="away">–</b><span>Looking away (s)</span></div><div class="tile"><b id="elapsed">–</b><span>Trip time</span></div>
        <div class="tile"><b id="yawns">0</b><span>Yawns</span></div><div class="tile"><b id="nods">0</b><span>Head nods</span></div><div class="tile"><b id="alerts">0</b><span>Warnings / danger</span></div>
      </div>
    </div>
  </div>
  <h2>Latest alerts</h2>
  <div class="card" style="overflow-x:auto"><table><thead><tr><th>Time</th><th>Level</th><th>Score</th><th>Reason</th></tr></thead><tbody id="tbody"><tr><td colspan="4">No alerts yet.</td></tr></tbody></table></div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i);}, wasOn=false;
  function post(a){return fetch("/api/"+a,{method:"POST"}).catch(function(){});}
  ["start","stop","recalibrate","lowlight","voice"].forEach(function(a){$(a).onclick=function(){post(a);};});
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x;}
  function show(id,v){$(id).textContent=(v===null||v===undefined)?"–":v;}
  function tick(){
    fetch("/api/status").then(function(r){return r.json();}).then(function(s){
      $("conn").textContent="Connected";
      var on=!!s.running;
      $("video").classList.toggle("on",on);
      if(on&&!wasOn){$("feed").src="/video?"+Date.now();}
      if(!on&&wasOn){$("feed").removeAttribute("src");}
      wasOn=on;
      $("err").textContent=s.error||"";
      var lv=s.level||0;
      document.body.className=on?"l"+lv:"";
      $("label").textContent=on?(s.calibrated===false?"Calibrating":s.label):"Stopped";
      $("reason").innerHTML=on&&s.calibrated?esc(s.reason):"&nbsp;";
      var c=lv===2?"var(--danger)":lv===1?"var(--warn)":"var(--ok)";
      $("bar").style.width=(s.score||0)+"%";$("bar").style.background=c;
      $("score").textContent="Fatigue "+(s.score||0)+"/100";
      var cb=$("calib");
      if(on&&s.calibrated===false){cb.style.display="block";cb.textContent="Calibrating "+Math.ceil(s.calib_left)+"s – eyes open, look at the camera";}else{cb.style.display="none";}
      show("ear",s.ear);show("mar",s.mar);show("fps",s.fps);show("closure",s.closure);show("away",s.away);
      $("elapsed").textContent=on?fmt(s.elapsed||0):"–";
      $("yawns").textContent=s.yawns||0;$("nods").textContent=s.nods||0;
      $("alerts").textContent=(s.warnings||0)+" / "+(s.dangers||0);
      $("lowlight").classList.toggle("on",!!s.lowlight);$("voice").classList.toggle("on",!!s.voice);
    }).catch(function(){$("conn").textContent="Server not reachable";});
  }
  function events(){
    fetch("/api/events").then(function(r){return r.json();}).then(function(rows){
      if(!rows.length) return;
      $("tbody").innerHTML=rows.map(function(e){
        return "<tr><td>"+esc(e.timestamp)+"</td><td>"+(e.level==="2"?"Danger":"Warning")+"</td><td>"+esc(e.score)+"</td><td>"+esc(e.reason)+"</td></tr>";
      }).join("");
    }).catch(function(){});
  }
  tick();events();setInterval(tick,300);setInterval(events,3000);
})();
</script>
<footer style="width: 100%; display: flex; justify-content: center; text-align: center;">
  <p style="margin: 0; padding: 10px 0;">&copy; 2026 Raman Yadav. All rights reserved.</p>
</footer>
</body>
</html>
